# Postgres OPCIONAL, para quien no tenga ya uno local.
#
# El entorno de desarrollo de este proyecto apunta a una instancia propia en el
# puerto 5440 (ver .env.example). Este contenedor es la alternativa para una
# maquina nueva: si se usa, hay que ajustar DB_PORT, DB_USERNAME y DB_PASSWORD en
# el .env a los valores de abajo.
#
# La version 16 no es casual: es la misma de la instancia de desarrollo, para que
# nadie descubra una diferencia de comportamiento entre mayores el dia del
# deploy.
services:
  postgres:
    image: postgres:16-alpine
    container_name: portafolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portafolio
      POSTGRES_PASSWORD: portafolio
      POSTGRES_DB: portafolio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portafolio -d portafolio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

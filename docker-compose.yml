# Postgres para desarrollo y para los tests de integracion.
#
# La version mayor se fija a proposito: en produccion manda el proveedor
# gestionado, y descubrir una diferencia de comportamiento entre mayores el dia
# del deploy es justo lo que este archivo evita.
services:
  postgres:
    image: postgres:17-alpine
    container_name: portafolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portafolio
      POSTGRES_PASSWORD: portafolio
      POSTGRES_DB: portafolio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portafolio -d portafolio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
